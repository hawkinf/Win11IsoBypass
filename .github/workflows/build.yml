name: Build

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Win11IsoBypass.csproj --configuration Release --nologo

      - name: Publish portable executable
        run: dotnet publish Win11IsoBypass.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output artifact

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowsIsoCustomizer-win-x64
          path: artifact/Win11IsoBypass.exe
